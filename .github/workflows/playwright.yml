name: Playwright Smoke and Guardrails

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'screens/**'
      - 'src/**'
      - 'worker/**'
      - 'e2e/**'
      - 'config/leonardo/night-asset-prompt-pack.json'
      - 'config/room-production.manifest.json'
      - 'scripts/room-production-foreman.mjs'
      - 'scripts/verify-cloudflare-native-deploy.mjs'
      - 'scripts/write-release-metadata.mjs'
      - 'test/cloudflare-native-deploy.test.mjs'
      - 'test/release-metadata.test.mjs'
      - 'test/room-production-contract.test.mjs'
      - 'docs/VISION.md'
      - 'docs/GUARDRAILS.md'
      - 'DEPLOYMENT.md'
      - 'wrangler.toml'
      - 'playwright.config.ts'
      - 'playwright.production.config.ts'
      - 'playwright.room.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/playwright.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'screens/**'
      - 'src/**'
      - 'worker/**'
      - 'e2e/**'
      - 'config/leonardo/night-asset-prompt-pack.json'
      - 'config/room-production.manifest.json'
      - 'scripts/room-production-foreman.mjs'
      - 'scripts/verify-cloudflare-native-deploy.mjs'
      - 'scripts/write-release-metadata.mjs'
      - 'test/cloudflare-native-deploy.test.mjs'
      - 'test/release-metadata.test.mjs'
      - 'test/room-production-contract.test.mjs'
      - 'docs/VISION.md'
      - 'docs/GUARDRAILS.md'
      - 'DEPLOYMENT.md'
      - 'wrangler.toml'
      - 'playwright.config.ts'
      - 'playwright.production.config.ts'
      - 'playwright.room.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current workflow head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Run exact-release unit tests
        run: node --test test/cloudflare-native-deploy.test.mjs test/release-metadata.test.mjs

      - name: Run room production contract tests
        run: node --test test/room-production-contract.test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke and guardrail tests
        run: npx playwright test

      - name: Run founder-preview room contract tests
        run: npm run test:e2e:rooms

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
