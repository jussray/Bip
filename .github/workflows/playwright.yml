name: Manual — Playwright Smoke and Guardrails

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the founder/control room is requesting browser evidence
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Manual browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current workflow head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Run exact-release unit tests
        run: node --test test/cloudflare-native-deploy.test.mjs test/release-metadata.test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke and guardrail tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
