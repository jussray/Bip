name: Playwright Smoke and Guardrails

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'screens/**'
      - 'src/**'
      - 'worker/**'
      - 'e2e/**'
      - 'scripts/verify-cloudflare-native-deploy.mjs'
      - 'scripts/write-release-metadata.mjs'
      - 'test/cloudflare-native-deploy.test.mjs'
      - 'test/release-metadata.test.mjs'
      - 'docs/VISION.md'
      - 'docs/GUARDRAILS.md'
      - 'DEPLOYMENT.md'
      - 'wrangler.toml'
      - 'playwright.config.ts'
      - 'playwright.production.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Run exact-release unit tests
        run: node --test test/cloudflare-native-deploy.test.mjs test/release-metadata.test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke and guardrail tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
