name: Audit Cloudflare Worker and Pages Branch Authority

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-branch-authority
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EVIDENCE_PATH: artifacts/cloudflare-worker-branch-authority.json
  PAGES_EVIDENCE_PATH: artifacts/cloudflare-pages-branch-authority.json

jobs:
  audit:
    name: Audit current two-Worker and one-Pages authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact current main before provider credential use
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$GITHUB_SHA" = "$current_main"

      - name: Read current two-Worker topology and verify production Worker branch authority
        shell: bash
        env:
          CLOUDFLARE_WORKERS_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node <<'NODE'
          const fs = require('node:fs');
          const API = 'https://api.cloudflare.com/client/v4';
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const token = String(process.env.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN || '').trim();
          const productionWorker = 'sekret-backend';
          const alphaWorker = 'sekret-backend-alpha';
          const pagesProject = 'sekret-bip';
          const terminal = new Set(['success', 'fail', 'skipped', 'cancelled', 'terminated']);
          const clean = (value) => String(value ?? '').trim();
          const active = (rows) => (Array.isArray(rows) ? rows : []).filter((row) => !row?.deleted_on);
          async function get(path) {
            const response = await fetch(`${API}${path}`, { headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' } });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success === false) throw new Error(`GET ${path} failed with provider status ${response.status}`);
            return payload?.result;
          }
          if (!accountId) throw new Error('CLOUDFLARE_ACCOUNT_ID is required.');
          if (!token) throw new Error('CLOUDFLARE_WORKERS_BUILDS_API_TOKEN is required.');
          const tokenState = await get('/user/tokens/verify');
          if (tokenState?.status !== 'active') throw new Error('Dedicated Workers Builds API token is not active.');
          const scripts = await get(`/accounts/${accountId}/workers/scripts?per_page=100`);
          const findWorker = (name) => (Array.isArray(scripts) ? scripts : []).filter((row) => clean(row?.id) === name);
          const productionMatches = findWorker(productionWorker);
          const alphaMatches = findWorker(alphaWorker);
          if (productionMatches.length !== 1) throw new Error(`${productionWorker}: expected exactly one Worker, found ${productionMatches.length}.`);
          if (alphaMatches.length !== 1) throw new Error(`${alphaWorker}: expected exactly one Worker, found ${alphaMatches.length}.`);
          const productionTag = clean(productionMatches[0]?.tag);
          const alphaTag = clean(alphaMatches[0]?.tag);
          if (!productionTag || !alphaTag) throw new Error('Both current Workers must expose immutable script tags.');
          const triggerRows = await get(`/accounts/${accountId}/builds/workers/${productionTag}/triggers`);
          const buildRows = await get(`/accounts/${accountId}/builds/workers/${productionWorker}/builds?per_page=50`);
          const activeTriggers = active(triggerRows);
          const productionTrigger = activeTriggers.length === 1 ? activeTriggers[0] : null;
          const includes = Array.isArray(productionTrigger?.branch_includes) ? productionTrigger.branch_includes.map(clean) : [];
          const excludes = Array.isArray(productionTrigger?.branch_excludes) ? productionTrigger.branch_excludes.map(clean) : [];
          const deployCommand = clean(productionTrigger?.deploy_command);
          const buildCommand = clean(productionTrigger?.build_command);
          const activeNonMainBuilds = (Array.isArray(buildRows) ? buildRows : []).filter((build) => {
            const branch = clean(build?.build_trigger_metadata?.branch);
            const outcome = clean(build?.build_outcome).toLowerCase();
            return branch && branch !== 'main' && !terminal.has(outcome);
          });
          const verifiedMainOnly = activeTriggers.length === 1 &&
            JSON.stringify(includes) === JSON.stringify(['main']) &&
            excludes.length === 0 &&
            deployCommand === 'npm run deploy:api:production' &&
            buildCommand === '' &&
            activeNonMainBuilds.length === 0;
          const alphaTriggers = await get(`/accounts/${accountId}/builds/workers/${alphaTag}/triggers`);
          const receipt = {
            schemaVersion: 4,
            generatedAt: new Date().toISOString(),
            trustedGitRef: process.env.GITHUB_REF || null,
            trustedGitSha: process.env.GITHUB_SHA || null,
            mode: 'read-only',
            mutationPerformed: false,
            providerTopology: {
              workers: [
                { name: productionWorker, role: 'production' },
                { name: alphaWorker, role: 'founder-gated-alpha', mutationAuthorized: false }
              ],
              pages: [{ name: pagesProject, role: 'frontend', mutationAuthorized: false }]
            },
            productionWorker: {
              name: productionWorker,
              scriptTag: productionTag,
              activeTriggerCount: activeTriggers.length,
              branchIncludes: includes,
              branchExcludes: excludes,
              deployCommand,
              buildCommand,
              activeNonMainBuildCount: activeNonMainBuilds.length,
              verifiedMainOnly
            },
            alphaWorker: {
              name: alphaWorker,
              scriptTag: alphaTag,
              activeTriggerCount: active(alphaTriggers).length,
              founderGatedObservationOnly: true
            },
            pagesProject: {
              name: pagesProject,
              verification: 'load-bearing-provider-readback',
              mutationAuthorized: false
            },
            workersAuthorityVerified: verifiedMainOnly
          };
          fs.writeFileSync(process.env.EVIDENCE_PATH, `${JSON.stringify(receipt, null, 2)}\n`, 'utf8');
          if (!verifiedMainOnly) {
            console.error('CLOUDFLARE_PRODUCTION_WORKER_BRANCH_AUTHORITY_NOT_VERIFIED');
            process.exit(1);
          }
          console.log('CLOUDFLARE_PRODUCTION_WORKER_BRANCH_AUTHORITY_VERIFIED_READ_ONLY');
          NODE

      - name: Read and verify Pages branch authority
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: sekret-bip
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: main
        run: node scripts/verify-cloudflare-pages-branch-authority.mjs --output "$PAGES_EVIDENCE_PATH"

      - name: Upload Cloudflare branch-authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-branch-authority-${{ github.sha }}
          path: |
            ${{ env.EVIDENCE_PATH }}
            ${{ env.PAGES_EVIDENCE_PATH }}
          if-no-files-found: warn
          retention-days: 30
