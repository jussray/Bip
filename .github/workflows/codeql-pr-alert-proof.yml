name: CodeQL PR Alert Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'security/**'
      - 'public/_headers'
      - 'wrangler.toml'
      - '.dev.vars.example'
      - 'scripts/verify-firewall-v10.mjs'
      - 'scripts/codeql-pr-alert-proof.mjs'
      - 'test/worker-auth.test.mjs'
      - 'test/codeql-pr-alert-proof.test.mjs'
      - 'test/cloudflare-worker-consolidation.test.mjs'
      - '.github/workflows/founder-shield.yml'
      - '.github/workflows/product-design-playwright-proof.yml'
      - '.github/workflows/codeql-pr-alert-proof.yml'

permissions:
  contents: read
  checks: read
  security-events: read

concurrency:
  group: codeql-pr-alert-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  CODEQL_SETTLE_TIMEOUT_MS: '1080000'
  CODEQL_POLL_MS: '10000'

jobs:
  codeql-pr-alert-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify CodeQL proof contract
        run: node --test test/codeql-pr-alert-proof.test.mjs

      - name: Capture PR-scoped CodeQL evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVIDENCE_DIR: artifacts/codeql-pr-alert-proof
        run: node scripts/codeql-pr-alert-proof.mjs

      - name: Upload CodeQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-pr-alert-proof-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/codeql-pr-alert-proof
          if-no-files-found: error
          retention-days: 30
