name: Refresh Piper Branch

on:
  push:
    branches: [feature-piper-tts-current]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-piper-tts-current
          fetch-depth: 0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/refresh-piper-branch.yml
          git add -A
          git commit -m "chore: refresh Piper branch from main"
          git push
