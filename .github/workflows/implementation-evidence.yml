name: Implementation Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ledger:
    name: Verify implementation claims
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate ledger and changed architecture documents
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            npm run verify:implementation-ledger -- --changed-since "origin/$BASE_REF"
          else
            npm run verify:implementation-ledger
          fi
