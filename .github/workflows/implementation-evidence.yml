name: Archived — Implementation Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-ledger:
    name: Manual legacy implementation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate ledger and changed architecture documents
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          if [[ -n "$BASE_REF" ]]; then
            npm run verify:implementation-ledger -- --changed-since "origin/$BASE_REF"
          else
            npm run verify:implementation-ledger
          fi
