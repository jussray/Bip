name: Live Signup Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-signup-proof.yml'
      - 'playwright.live-onboarding.config.ts'
      - 'e2e/live-onboarding-email.spec.ts'
      - 'test/live-onboarding-email-gate.test.mjs'
  push:
    branches:
      - fix/production-signup-age-continue
    paths:
      - '.github/workflows/live-signup-proof.yml'
      - 'playwright.live-onboarding.config.ts'
      - 'e2e/live-onboarding-email.spec.ts'
      - 'test/live-onboarding-email-gate.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-signup-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PRODUCTION_BASE_URL: https://sekretbip.net
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  live-signup-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact proof head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Require explicit live-write opt-in
        id: opt_in
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] || git log -1 --pretty=%B | grep -Fq '[live-signup-proof]'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Live signup proof explicitly enabled for this exact head.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Live signup proof not enabled; no account write will occur.'
          fi

      - name: Set up Node
        if: steps.opt_in.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.opt_in.outputs.enabled == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.opt_in.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: Prepare disposable guest identity
        if: steps.opt_in.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          email="sekretbip+pw-${GITHUB_RUN_ID}@gmail.com"
          username="pw${GITHUB_RUN_ID}"
          password="$(node -e "console.log(require('node:crypto').randomBytes(18).toString('base64url') + 'Aa9!')")"
          echo "::add-mask::$password"
          {
            printf 'LIVE_ONBOARDING_EMAIL=%s\n' "$email"
            printf 'LIVE_ONBOARDING_USERNAME=%s\n' "$username"
            printf 'LIVE_ONBOARDING_PASSWORD=%s\n' "$password"
          } >> "$GITHUB_ENV"
          node -e "const fs=require('node:fs'); fs.writeFileSync('artifacts/live-signup-proof-account.json', JSON.stringify({email: process.argv[1], username: process.argv[2], runId: process.env.GITHUB_RUN_ID, headSha: process.env.EXPECTED_HEAD_SHA}, null, 2))" "$email" "$username"
          printf 'Disposable live signup email: %s\n' "$email"
          printf 'Disposable live signup username: %s\n' "$username"

      - name: Create disposable account through production UI
        if: steps.opt_in.outputs.enabled == 'true'
        env:
          LIVE_ONBOARDING_PHASE: signup
        run: npx playwright test --config=playwright.live-onboarding.config.ts

      - name: Prove returning-user sign in
        if: steps.opt_in.outputs.enabled == 'true'
        env:
          LIVE_ONBOARDING_PHASE: signin
          LIVE_SIGNIN_ATTEMPTS: '10'
          LIVE_SIGNIN_RETRY_MS: '30000'
        run: npx playwright test --config=playwright.live-onboarding.config.ts

      - name: Upload live signup proof
        if: always() && steps.opt_in.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-signup-proof-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            artifacts/live-signup-proof-account.json
            playwright-report-live-onboarding/
            test-results/
          if-no-files-found: warn
          retention-days: 14
