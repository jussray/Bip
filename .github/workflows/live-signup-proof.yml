name: Live Signup Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-signup-proof.yml'
      - 'playwright.live-onboarding.config.ts'
      - 'e2e/live-onboarding-email.spec.ts'
      - 'app/(auth)/signup.tsx'
      - 'scripts/live-signup-mailbox.mjs'
      - 'test/live-onboarding-email-gate.test.mjs'
  push:
    branches:
      - fix/production-signup-age-continue
    paths:
      - '.github/workflows/live-signup-proof.yml'
      - 'playwright.live-onboarding.config.ts'
      - 'e2e/live-onboarding-email.spec.ts'
      - 'app/(auth)/signup.tsx'
      - 'scripts/live-signup-mailbox.mjs'
      - 'test/live-onboarding-email-gate.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-signup-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LIVE_ONBOARDING_BASE_URL: https://fix-production-signup-age-co.sekret-bip.pages.dev
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  live-signup-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact proof head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Require explicit live-write opt-in
        id: opt_in
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] || git log -1 --pretty=%B | grep -Fq '[live-signup-proof]'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Live signup proof explicitly enabled for this exact head.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Live signup proof not enabled; no account write will occur.'
          fi

      - name: Verify isolated preview is exact head
        if: steps.opt_in.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.LIVE_ONBOARDING_BASE_URL;
          const expected = process.env.EXPECTED_HEAD_SHA;
          const parsedBase = new URL(base);
          if (!parsedBase.hostname.endsWith('.pages.dev') || parsedBase.hostname === 'sekretbip.net') {
            throw new Error(`Live signup PR proof must target an isolated Pages preview, got ${parsedBase.hostname}`);
          }
          const markerUrl = new URL('/.well-known/sekret-release.json', base);
          const deadline = Date.now() + 240_000;
          let last = null;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${markerUrl}?proof=${Date.now()}`, { cache: 'no-store' });
              const body = response.ok ? await response.json() : null;
              last = { status: response.status, commitSha: body?.commitSha ?? null, environment: body?.environment ?? null };
              if (response.ok && body?.commitSha === expected && body?.environment === 'preview') {
                console.log(`Exact isolated preview verified: ${parsedBase.hostname} @ ${expected}`);
                process.exit(0);
              }
            } catch (error) {
              last = { error: error instanceof Error ? error.message : String(error) };
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          throw new Error(`Exact preview did not reach ${expected}: ${JSON.stringify(last)}`);
          NODE

      - name: Set up Node
        if: steps.opt_in.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Prepare disposable guest identity and mailbox
        if: steps.opt_in.outputs.enabled == 'true'
        run: node scripts/live-signup-mailbox.mjs create

      - name: Install dependencies
        if: steps.opt_in.outputs.enabled == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.opt_in.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: Create disposable account through exact preview UI
        if: steps.opt_in.outputs.enabled == 'true'
        env:
          LIVE_ONBOARDING_PHASE: signup
        run: npx playwright test --config=playwright.live-onboarding.config.ts

      - name: Confirm disposable signup email
        if: steps.opt_in.outputs.enabled == 'true'
        env:
          LIVE_MAILBOX_TIMEOUT_MS: '120000'
          LIVE_MAILBOX_POLL_MS: '3000'
        run: node scripts/live-signup-mailbox.mjs confirm

      - name: Prove returning-user sign in
        if: steps.opt_in.outputs.enabled == 'true'
        env:
          LIVE_ONBOARDING_PHASE: signin
          LIVE_SIGNIN_ATTEMPTS: '3'
          LIVE_SIGNIN_RETRY_MS: '5000'
        run: npx playwright test --config=playwright.live-onboarding.config.ts

      - name: Remove disposable mailbox
        if: always() && steps.opt_in.outputs.enabled == 'true'
        run: node scripts/live-signup-mailbox.mjs cleanup

      - name: Upload live signup proof
        if: always() && steps.opt_in.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-signup-proof-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            artifacts/live-signup-proof-account.json
            artifacts/live-signup-confirmation.json
            artifacts/live-signup-mailbox-cleanup.json
            playwright-report-live-onboarding/
            test-results/
          if-no-files-found: warn
          retention-days: 14
