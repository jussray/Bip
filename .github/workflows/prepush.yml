name: Pre-Push Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prepush:
    name: Type-Check + Lint + Archive Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Hydrate LFS assets
        run: git lfs pull

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Audit runtime assets
        run: npm run audit:runtime-assets

      - name: Verify room archives
        run: |
          cp -f assets/images/bg-*.png assets/images/archive/
          npm run verify:room-archives
