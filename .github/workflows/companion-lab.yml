name: Companion Lab Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/companion-lab-audit.js'
      - 'test/fixtures/companion-lab-scenarios.json'
      - 'test/fixtures/replies/**'
      - 'docs/COMPANION_LAB.md'
      - '.github/workflows/companion-lab.yml'
      - 'package.json'
      - 'worker/sekret-reply.ts'
      - 'src/services/ai/**'
      - 'src/utils/sekretReply.ts'
      - 'src/services/sekretVoice.ts'
  pull_request:
    paths:
      - 'scripts/companion-lab-audit.js'
      - 'test/fixtures/companion-lab-scenarios.json'
      - 'test/fixtures/replies/**'
      - 'docs/COMPANION_LAB.md'
      - '.github/workflows/companion-lab.yml'
      - 'package.json'
      - 'worker/sekret-reply.ts'
      - 'src/services/ai/**'
      - 'src/utils/sekretReply.ts'
      - 'src/services/sekretVoice.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Score companion reply fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check audit script
        run: node --check scripts/companion-lab-audit.js

      - name: Run Companion Lab audit
        run: |
          set -o pipefail
          npm run audit:companion-lab:verbose 2>&1 | tee companion-lab-report.txt
        # Exit 0 = all scored scenarios pass (or no reply files yet — gap report).
        # Exit 1 = one or more hard-fail or below-threshold results.

      - name: Capture lint diagnostics
        id: lint_diagnostics
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee companion-lab-lint.txt

      - name: Capture unit-test diagnostics
        id: test_diagnostics
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee companion-lab-tests.txt

      - name: Upload audit and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-lab-report
          path: |
            companion-lab-report.txt
            companion-lab-lint.txt
            companion-lab-tests.txt
          retention-days: 30

      - name: Enforce diagnostic results
        if: always()
        run: |
          test "${{ steps.lint_diagnostics.outcome }}" = "success"
          test "${{ steps.test_diagnostics.outcome }}" = "success"
