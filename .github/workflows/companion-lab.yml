name: Companion Lab Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/companion-lab-audit.js'
      - 'test/fixtures/companion-lab-scenarios.json'
      - 'test/fixtures/replies/**'
      - 'docs/COMPANION_LAB.md'
  pull_request:
    paths:
      - 'scripts/companion-lab-audit.js'
      - 'test/fixtures/companion-lab-scenarios.json'
      - 'test/fixtures/replies/**'
      - 'docs/COMPANION_LAB.md'
  workflow_dispatch:

jobs:
  audit:
    name: Score companion reply fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Companion Lab audit
        id: audit
        run: node scripts/companion-lab-audit.js --verbose
        # Exit 0 = all scored scenarios pass (or no reply files yet — gap report).
        # Exit 1 = one or more hard-fail or below-threshold results.

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-lab-report
          path: |
            test/fixtures/companion-lab-scenarios.json
            test/fixtures/replies/
          retention-days: 30
          if-no-files-found: ignore
