name: Regression Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - ci/regression-test-action
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check and regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Core test suite
        run: npm test

      - name: Oracle discovery tests
        run: npm run test:oracle

      - name: Voice intelligence tests
        run: npm run test:voice-intelligence

      - name: Device sync tests
        run: npm run test:device-sync
