name: Regression Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - ci/regression-test-action
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check and regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Core test suite
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          while IFS= read -r test_file; do
            output_file="$(mktemp)"
            if node --test "$test_file" >"$output_file" 2>&1; then
              passed=$((passed + 1))
              rm -f "$output_file"
              continue
            fi

            echo "::error file=$test_file::Core regression failed in $test_file"
            echo "Failing test output:"
            cat "$output_file"
            rm -f "$output_file"
            exit 1
          done < <(find test -type f -name '*.test.mjs' -print | sort)

          echo "Core regression passed: $passed test files"

      - name: Oracle discovery tests
        run: npm run test:oracle

      - name: Voice intelligence tests
        run: npm run test:voice-intelligence

      - name: Device sync tests
        run: npm run test:device-sync
