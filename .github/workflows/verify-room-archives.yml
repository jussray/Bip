name: Verify Room Archives

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-archives:
    name: Archive Integrity Check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hydrate LFS assets
        run: git lfs pull

      - name: Confirm live files are real PNGs
        run: |
          echo "── Live bg-*.png sizes ──"
          ls -lh assets/images/bg-*.png
          STUBS=$(find assets/images -maxdepth 1 -name 'bg-*.png' -size -1k | wc -l)
          if [ "$STUBS" -gt 0 ]; then
            echo "❌ $STUBS live file(s) are under 1 KB — LFS pull may have failed."
            exit 1
          fi
          echo "✅ All live files are real PNGs."

      - name: Auto-repair archive stubs
        run: |
          echo "── Copying live files to archive/ ──"
          cp -f assets/images/bg-*.png assets/images/archive/
          echo "── Archive sizes after repair ──"
          ls -lh assets/images/archive/bg-*.png

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run verify:room-archives --strict-match
        run: node scripts/verify-room-archives.js --strict-match

      - name: Commit repaired archives (if changed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images/archive/
          if git diff --cached --quiet; then
            echo "✅ Archive already up-to-date — nothing to commit."
          else
            git commit -m "fix: replace LFS stub archive copies with real PNG bytes [skip ci]"
            git push
          fi
