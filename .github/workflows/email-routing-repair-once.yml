name: Verify Rotated Email Routing Token Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/email-routing-repair-once.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-email-routing-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BIP_EMAIL_ZONE: sekretbip.net
  BIP_EMAIL_WORKER: sekret-backend
  BIP_EMAIL_DESTINATION: sekretbip@gmail.com

jobs:
  verify_and_apply:
    name: Verify rotated token and apply email routing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify token and reconcile routing
        id: repair
        shell: bash
        run: |
          set -uo pipefail
          outcome="reconcile_failed"

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            outcome="token_missing"
          else
            verify_payload="$(curl --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              https://api.cloudflare.com/client/v4/user/tokens/verify || true)"

            if [[ "$(jq -r '.success // false' <<<"$verify_payload" 2>/dev/null)" != "true" ]]; then
              outcome="token_invalid"
            else
              set +e
              node scripts/reconcile-cloudflare-email-routing.mjs --apply > /tmp/reconcile.log 2>&1
              rc=$?
              set -e

              if [[ $rc -eq 0 ]]; then
                outcome="applied"
              elif grep -q 'DESTINATION_VERIFICATION_REQUIRED' /tmp/reconcile.log; then
                outcome="destination_verification_required"
              elif grep -Eq '403|permission|not authorized|Authentication error|Unauthorized' /tmp/reconcile.log; then
                outcome="token_under_scoped"
              elif grep -q 'ZONE_NOT_FOUND' /tmp/reconcile.log; then
                outcome="zone_unavailable"
              fi
            fi
          fi

          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Write sanitized operator receipt
        if: always()
        env:
          OUTCOME: ${{ steps.repair.outputs.outcome }}
        run: |
          gh issue comment 762 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Rotated-token email routing outcome: \`${OUTCOME:-workflow_failed_before_classification}\`. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotated-email-routing-${{ github.run_id }}
          path: artifacts/cloudflare-email-routing-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail closed unless fully applied
        if: steps.repair.outputs.outcome != 'applied'
        run: exit 1
