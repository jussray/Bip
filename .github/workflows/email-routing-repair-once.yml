name: Repair Email Routing Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/email-routing-repair-once.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-email-routing-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BIP_EMAIL_ZONE: sekretbip.net
  BIP_EMAIL_WORKER: sekret-backend
  BIP_EMAIL_DESTINATION: sekretbip@gmail.com

jobs:
  repair:
    name: Diagnose and apply Bip email routing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Diagnose and reconcile live routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          post_status() {
            local state="$1"
            local description="$2"
            jq -n \
              --arg state "$state" \
              --arg description "$description" \
              --arg context "email-routing-repair" \
              '{state:$state,description:$description,context:$context}' \
              > /tmp/status.json
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @/tmp/status.json >/dev/null
          }

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            post_status error "cloudflare-token-missing"
            echo "CLOUDFLARE_API_TOKEN is not configured." >&2
            exit 1
          fi

          verify_payload="$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          if [[ "$(jq -r '.success // false' <<<"$verify_payload" 2>/dev/null)" != "true" ]]; then
            post_status failure "cloudflare-token-invalid"
            echo "Cloudflare rejected CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

          set +e
          node scripts/reconcile-cloudflare-email-routing.mjs --apply > /tmp/reconcile.log 2>&1
          rc=$?
          set -e

          cat /tmp/reconcile.log

          if [[ $rc -eq 0 ]]; then
            post_status success "email-routing-applied"
            exit 0
          fi

          if grep -q 'DESTINATION_VERIFICATION_REQUIRED' /tmp/reconcile.log; then
            post_status pending "destination-verification-required"
            exit 1
          fi

          if grep -Eq '403|permission|not authorized|Authentication error|Unauthorized' /tmp/reconcile.log; then
            post_status failure "cloudflare-token-under-scoped"
            exit 1
          fi

          if grep -q 'ZONE_NOT_FOUND' /tmp/reconcile.log; then
            post_status failure "cloudflare-zone-read-denied-or-missing"
            exit 1
          fi

          post_status failure "email-routing-reconcile-failed"
          exit "$rc"

      - name: Upload routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-routing-repair-${{ github.run_id }}
          path: artifacts/cloudflare-email-routing-evidence.json
          if-no-files-found: warn
          retention-days: 7
