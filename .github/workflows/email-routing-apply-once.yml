name: Apply Cloudflare Email Routing Once

on:
  push:
    branches: [main]
    paths:
      - "ops/email-routing-apply.trigger"

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-email-routing-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BIP_EMAIL_ZONE: sekretbip.net
  BIP_EMAIL_WORKER: sekret-backend
  BIP_EMAIL_DESTINATION: sekretbip@gmail.com

jobs:
  apply:
    name: Apply Email Routing and report sanitized outcome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reconcile and classify live routing
        id: reconcile
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node scripts/reconcile-cloudflare-email-routing.mjs --apply > /tmp/reconcile.log 2>&1
          rc=$?
          set -e

          outcome="reconcile_failed"
          if [[ $rc -eq 0 ]]; then
            outcome="applied"
          elif grep -q 'DESTINATION_VERIFICATION_REQUIRED' /tmp/reconcile.log; then
            outcome="destination_verification_required"
          elif grep -q 'CLOUDFLARE_API_TOKEN_INVALID_OR_UNSCOPED' /tmp/reconcile.log; then
            outcome="token_invalid_or_unscoped"
          elif grep -q 'ACCOUNT_ID_NOT_FOUND' /tmp/reconcile.log; then
            outcome="account_id_not_found"
          elif grep -Eq 'ZONE_NOT_FOUND|ZONE_ID_MISMATCH' /tmp/reconcile.log; then
            outcome="zone_resolution_failed"
          elif grep -Eqi 'code=10000|code=9109|permission|not authorized|Unauthorized|Authentication error' /tmp/reconcile.log; then
            outcome="token_under_scoped"
          elif grep -q 'CATCH_ALL_ENABLED' /tmp/reconcile.log; then
            outcome="catch_all_enabled"
          elif grep -q 'DUPLICATE_SUPPORTED_ROUTES' /tmp/reconcile.log; then
            outcome="duplicate_supported_routes"
          fi

          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "LIVE_EMAIL_ROUTING_OUTCOME=$outcome"

      - name: Write sanitized operator receipt
        if: always()
        env:
          OUTCOME: ${{ steps.reconcile.outputs.outcome }}
        run: |
          gh issue comment 762 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Post-merge live Email Routing outcome: \`${OUTCOME:-workflow_failed_before_classification}\`. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-email-routing-${{ github.run_id }}
          path: artifacts/cloudflare-email-routing-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail closed unless fully applied
        if: steps.reconcile.outputs.outcome != 'applied'
        run: exit 1
