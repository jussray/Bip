name: Probe Cloudflare Email Routing Permissions Once

on:
  push:
    branches: [main]
    paths:
      - "ops/email-routing-apply.trigger"

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-email-routing-production
  cancel-in-progress: false

jobs:
  probe:
    name: Probe Cloudflare Email Routing read permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe read-only Cloudflare endpoints
        id: probe
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local label="$1"
            local url="$2"
            local tmp http success state
            tmp="$(mktemp)"
            http="$(curl --silent --show-error \
              -o "$tmp" \
              -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$url" || true)"
            success="$(jq -r 'if .success == true then "true" else "false" end' "$tmp" 2>/dev/null || echo false)"
            rm -f "$tmp"

            if [[ "$http" =~ ^2[0-9][0-9]$ && "$success" == "true" ]]; then
              state="ok"
            elif [[ "$http" =~ ^2[0-9][0-9]$ ]]; then
              state="api_denied_http_${http}"
            else
              state="http_${http:-000}"
            fi
            printf '%s=%s' "$label" "$state"
          }

          parts=()
          parts+=("$(probe user_token 'https://api.cloudflare.com/client/v4/user/tokens/verify')")

          if [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            parts+=("$(probe account_token "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")")
            parts+=("$(probe addresses_read "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/email/routing/addresses?per_page=1")")
          else
            parts+=("account_token=id_missing")
            parts+=("addresses_read=id_missing")
          fi

          if [[ -n "${CLOUDFLARE_ZONE_ID:-}" ]]; then
            parts+=("$(probe zone_read "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}")")
            parts+=("$(probe routing_dns_read "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/email/routing/dns")")
            parts+=("$(probe rules_read "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/email/routing/rules?per_page=1")")
            parts+=("$(probe catch_all_read "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/email/routing/rules/catch_all")")
          else
            parts+=("zone_read=id_missing")
            parts+=("routing_dns_read=id_missing")
            parts+=("rules_read=id_missing")
            parts+=("catch_all_read=id_missing")
          fi

          summary="$(IFS='; '; echo "${parts[*]}")"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_PERMISSION_PROBE_COMPLETE"

      - name: Write sanitized permission receipt
        env:
          SUMMARY: ${{ steps.probe.outputs.summary }}
        run: |
          gh issue comment 762 \
            --repo "$GITHUB_REPOSITORY" \
            --body "Cloudflare read-only permission probe: \`${SUMMARY}\`. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
