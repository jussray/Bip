name: Exact Duplicate Audit

on:
  push:
    branches: [fix-journal-avatar-presentation]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-journal-avatar-presentation
      - run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import hashlib
          groups = defaultdict(list)
          skip_dirs = {'.git','node_modules','.expo','dist','coverage'}
          skip_ext = {'.png','.jpg','.jpeg','.gif','.webp','.mp3','.wav','.mp4','.mov','.zip','.pdf'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(x in skip_dirs for x in p.parts) or p.suffix.lower() in skip_ext:
                  continue
              data = p.read_bytes()
              if data.strip(): groups[hashlib.sha256(data).hexdigest()].append(p.as_posix())
          dupes = sorted((sorted(v) for v in groups.values() if len(v) > 1), key=lambda v: (-len(v), v))
          out = ['# Exact Duplicate Source Files','']
          if not dupes: out.append('No exact duplicate text/source files found.')
          for i, paths in enumerate(dupes, 1):
              out += [f'## Group {i}', *[f'- `{p}`' for p in paths], '']
          Path('docs/REPO_HEALTH_DUPLICATES.md').write_text('\n'.join(out)+'\n')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/REPO_HEALTH_DUPLICATES.md
          git commit -m "docs: record exact duplicate source audit"
          git push

# Triggered after workflow creation.
