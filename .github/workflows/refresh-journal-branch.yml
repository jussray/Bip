name: Refresh Journal Health Branch

on:
  push:
    branches: [fix-journal-avatar-presentation]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-journal-avatar-presentation
          fetch-depth: 0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/refresh-journal-branch.yml
          git add -A
          git commit -m "chore: refresh journal health branch from main"
          git push

# Triggered after workflow creation.
