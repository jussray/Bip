name: Test Output Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture unit-test output
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload unit-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostic
          path: test-output.log
          if-no-files-found: error
      - name: Preserve test status
        if: steps.tests.outputs.status != '0'
        run: exit 1
