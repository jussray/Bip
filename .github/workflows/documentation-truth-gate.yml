name: Documentation Truth Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'SPRINT.md'
      - 'DEPLOYMENT.md'
      - 'docs/**'
      - '.control-room/README_SYNC_POLICY.md'
      - 'scripts/audit-documentation-truth.mjs'
      - 'test/documentation-truth-drift.test.mjs'
      - '.github/workflows/documentation-truth-gate.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'SPRINT.md'
      - 'DEPLOYMENT.md'
      - 'docs/**'
      - '.control-room/README_SYNC_POLICY.md'
      - 'scripts/audit-documentation-truth.mjs'
      - 'test/documentation-truth-drift.test.mjs'
      - '.github/workflows/documentation-truth-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  documentation-truth:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Parse-check truth auditor
        run: node --check scripts/audit-documentation-truth.mjs

      - name: Verify truth-expiry contracts
        run: node --test test/documentation-truth-drift.test.mjs

      - name: Audit canonical documentation truth
        run: node scripts/audit-documentation-truth.mjs --report=artifacts/documentation-truth-report.json

      - name: Upload truth-drift evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-truth-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/documentation-truth-report.json
          if-no-files-found: error
          retention-days: 30
