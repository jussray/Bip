name: Quality Gate

on:
  workflow_call:
    inputs:
      run_vendor_gates:
        description: Run optional Qodo and SonarQube vendor gates.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_vendor_gates:
        description: Run optional Qodo and SonarQube vendor gates.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repository-gate:
    name: Repository Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Hydrate LFS assets
        run: git lfs pull

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify MCP configuration
        run: npm run verify:mcp

      - name: Verify implementation claims
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          if [[ -n "$BASE_REF" ]]; then
            npm run verify:implementation-ledger -- --changed-since "origin/$BASE_REF"
          else
            npm run verify:implementation-ledger
          fi

      - name: Audit runtime assets
        run: npm run audit:runtime-assets

      - name: Audit Control Room structure and RLS
        run: npm run audit:control-room

      - name: Validate companion assets
        run: npm run validate:companions

      - name: Verify room archives
        run: npm run verify:room-archives

      - name: Run Control Room scanners in report-only mode
        run: npm run audit:control-room:ingest
        env:
          CONTROL_ROOM_REPORT_ONLY: 'true'

      - name: Generate Supabase advisor report in report-only mode
        run: npm run audit:control-room:advisors
        env:
          CONTROL_ROOM_REPORT_ONLY: 'true'

      - name: Detect Qodo configuration
        id: qodo_config
        if: ${{ inputs.run_vendor_gates }}
        shell: bash
        env:
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
        run: |
          if [[ -n "$QODO_API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Qodo is not configured; skipping the optional vendor gate."
          fi

      - name: Run Qodo tests
        if: ${{ inputs.run_vendor_gates && steps.qodo_config.outputs.configured == 'true' }}
        run: npx qodo test --coverage --reporter=json --output=qodo-results.json
        env:
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}

      - name: Evaluate Qodo gate
        if: ${{ inputs.run_vendor_gates && steps.qodo_config.outputs.configured == 'true' }}
        run: |
          node -e "
            const r = require('./qodo-results.json');
            const failed = r.failures ?? [];
            const contracts = r.contractViolations ?? [];
            if (failed.length > 0 || contracts.length > 0) {
              console.error('Qodo gate failed:');
              [...failed, ...contracts].forEach(f => console.error(' •', f.message));
              process.exit(1);
            }
            console.log('Qodo gate passed.');
          "

      - name: Detect SonarQube configuration
        id: sonar_config
        if: ${{ inputs.run_vendor_gates }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [[ -n "$SONAR_TOKEN" && -n "$SONAR_HOST_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube is not configured; skipping the optional vendor gate."
          fi

      - name: SonarQube Scan
        if: ${{ inputs.run_vendor_gates && steps.sonar_config.outputs.configured == 'true' }}
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=sekret-bip
            -Dsonar.qualitygate.wait=true
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Upload Control Room scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-scanner-report
          path: artifacts/control-room/scanner-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Supabase advisor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-advisors-report
          path: artifacts/control-room/supabase-advisors-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Qodo results
        if: ${{ always() && inputs.run_vendor_gates }}
        uses: actions/upload-artifact@v4
        with:
          name: qodo-results
          path: qodo-results.json
          if-no-files-found: ignore
          retention-days: 14
