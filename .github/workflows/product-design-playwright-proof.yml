name: Product Design Playwright Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'screens/**'
      - 'components/PresenceAvatar.tsx'
      - 'hooks/useReducedMotion.ts'
      - 'assets/**'
      - 'worker/**'
      - 'security/**'
      - 'public/_headers'
      - 'wrangler.toml'
      - '.dev.vars.example'
      - 'scripts/verify-firewall-v10.mjs'
      - 'scripts/codeql-pr-alert-proof.mjs'
      - 'e2e/product-design-review.spec.ts'
      - 'test/night-room-runtime-registry.test.mjs'
      - 'test/companion-runtime-contracts.test.mjs'
      - 'test/dual-front-door-contract.test.mjs'
      - 'test/front-door-motion-contract.test.mjs'
      - 'test/voice-presence-motion-contract.test.mjs'
      - 'test/worker-auth.test.mjs'
      - 'test/cloudflare-worker-consolidation.test.mjs'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codeql-pr-alert-proof.yml'
      - '.github/workflows/founder-shield.yml'
      - '.github/workflows/product-design-playwright-proof.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'screens/**'
      - 'components/PresenceAvatar.tsx'
      - 'hooks/useReducedMotion.ts'
      - 'assets/**'
      - 'worker/**'
      - 'security/**'
      - 'public/_headers'
      - 'wrangler.toml'
      - '.dev.vars.example'
      - 'scripts/verify-firewall-v10.mjs'
      - 'scripts/codeql-pr-alert-proof.mjs'
      - 'e2e/product-design-review.spec.ts'
      - 'test/night-room-runtime-registry.test.mjs'
      - 'test/companion-runtime-contracts.test.mjs'
      - 'test/dual-front-door-contract.test.mjs'
      - 'test/front-door-motion-contract.test.mjs'
      - 'test/voice-presence-motion-contract.test.mjs'
      - 'test/worker-auth.test.mjs'
      - 'test/cloudflare-worker-consolidation.test.mjs'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codeql-pr-alert-proof.yml'
      - '.github/workflows/founder-shield.yml'
      - '.github/workflows/product-design-playwright-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  product-design-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'event=%s\nexpected=%s\nactual=%s\n' "$GITHUB_EVENT_NAME" "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check exact head
        run: npm run type-check

      - name: Verify Product Design contracts
        run: node --test test/night-room-runtime-registry.test.mjs test/companion-runtime-contracts.test.mjs test/dual-front-door-contract.test.mjs test/front-door-motion-contract.test.mjs test/voice-presence-motion-contract.test.mjs

      - run: npx playwright install --with-deps chromium

      - name: Capture exact-head Product Design evidence
        env:
          CI: 'true'
          PLAYWRIGHT_ARTIFACT_DIR: artifacts/product-design-playwright
          EXPO_PUBLIC_ENABLE_FOUNDER_PREVIEW: 'true'
        run: npx playwright test e2e/product-design-review.spec.ts --project=chromium

      - name: Upload Product Design evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-design-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/product-design-playwright
          if-no-files-found: error
          retention-days: 30
