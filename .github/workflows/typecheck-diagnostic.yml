name: Type Check Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture TypeScript output
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run type-check > typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload TypeScript output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: typecheck.log
          if-no-files-found: error
      - name: Preserve failure status
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
