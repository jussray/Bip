name: Deploy Supabase Production Migrations

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current-main commit SHA whose migrations should be evaluated'
        required: true
        type: string
      mode:
        description: 'Dry-run previews; apply executes SQL; normalize-alias reconciles one reviewed applied receipt'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
          - normalize-alias
      confirm_project:
        description: 'Type the production Supabase project ref to confirm the target'
        required: true
        type: string
      apply_confirmation:
        description: 'For apply only, type APPLY PRODUCTION MIGRATIONS'
        required: false
        default: ''
        type: string
      canonical_version:
        description: 'For normalize-alias only, enter the exact canonical 14-digit repository migration version'
        required: false
        default: ''
        type: string
      execution_version:
        description: 'For normalize-alias only, enter the exact 14-digit applied execution receipt version'
        required: false
        default: ''
        type: string
      normalize_confirmation:
        description: 'For normalize-alias only, type NORMALIZE APPLIED MIGRATION ALIAS'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPABASE_PROJECT_REF: tbsevonvegdnlyjgplmm
  SUPABASE_SCHEMA_EVIDENCE_PATH: artifacts/supabase-production-schema.json

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate-production:
    name: ${{ inputs.mode == 'apply' && 'Apply production migrations' || inputs.mode == 'normalize-alias' && 'Normalize applied migration alias' || 'Dry-run production migrations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate dispatch intent
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          MODE: ${{ inputs.mode }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
          CANONICAL_VERSION: ${{ inputs.canonical_version }}
          EXECUTION_VERSION: ${{ inputs.execution_version }}
          NORMALIZE_CONFIRMATION: ${{ inputs.normalize_confirmation }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'target_sha must be a full 40-character commit SHA.' >&2
            exit 1
          }
          test "$CONFIRM_PROJECT" = "$SUPABASE_PROJECT_REF" || {
            echo 'Production project confirmation does not match the repository-owned project ref.' >&2
            exit 1
          }
          case "$MODE" in
            dry-run) ;;
            apply)
              test "$APPLY_CONFIRMATION" = 'APPLY PRODUCTION MIGRATIONS' || {
                echo 'Apply confirmation is missing or incorrect.' >&2
                exit 1
              }
              ;;
            normalize-alias)
              [[ "$CANONICAL_VERSION" =~ ^[0-9]{14}$ ]] || {
                echo 'canonical_version must be an exact 14-digit migration version.' >&2
                exit 1
              }
              [[ "$EXECUTION_VERSION" =~ ^[0-9]{14}$ ]] || {
                echo 'execution_version must be an exact 14-digit migration version.' >&2
                exit 1
              }
              test "$CANONICAL_VERSION" != "$EXECUTION_VERSION" || {
                echo 'Canonical and execution versions must differ for alias normalization.' >&2
                exit 1
              }
              test "$NORMALIZE_CONFIRMATION" = 'NORMALIZE APPLIED MIGRATION ALIAS' || {
                echo 'Alias-normalization confirmation is missing or incorrect.' >&2
                exit 1
              }
              ;;
            *)
              echo "Unsupported migration mode: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact target is current main
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'requested=%s\nactual=%s\n' "$TARGET_SHA" "$actual"
          test "$actual" = "$TARGET_SHA"

          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          printf 'current_main=%s\n' "$current_main"
          test "$TARGET_SHA" = "$current_main" || {
            echo 'Refusing to evaluate production migrations from a SHA that is no longer current main.' >&2
            exit 1
          }

      - name: Validate reviewed applied alias belongs to exact target
        if: ${{ inputs.mode == 'normalize-alias' }}
        shell: bash
        env:
          CANONICAL_VERSION: ${{ inputs.canonical_version }}
          EXECUTION_VERSION: ${{ inputs.execution_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          canonical_matches=(supabase/migrations/"${CANONICAL_VERSION}"_*.sql)
          execution_matches=(supabase/migrations/"${EXECUTION_VERSION}"_*.sql)
          test "${#canonical_matches[@]}" -eq 1 || {
            echo "Canonical version must resolve to exactly one repository migration; found ${#canonical_matches[@]}." >&2
            exit 1
          }
          test "${#execution_matches[@]}" -eq 0 || {
            echo 'Execution receipt already exists as a local migration; refusing alias normalization.' >&2
            exit 1
          }
          node --input-type=module <<'NODE'
          import { PRODUCTION_HISTORY_APPLIED_ALIASES } from './scripts/verify-supabase-production-schema.mjs';

          const canonical = process.env.CANONICAL_VERSION;
          const execution = process.env.EXECUTION_VERSION;
          if (PRODUCTION_HISTORY_APPLIED_ALIASES[canonical] !== execution) {
            console.error('Requested canonical/execution pair is not an explicitly reviewed applied-production alias.');
            process.exit(1);
          }
          console.log(`reviewed_alias=${canonical}->${execution}`);
          NODE

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Verify production credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is not configured for this workflow.' >&2
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo 'SUPABASE_DB_PASSWORD is not configured for this workflow.' >&2
            exit 1
          }

      - name: Link exact production project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview production migration plan
        if: ${{ inputs.mode != 'normalize-alias' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          supabase db push --linked --dry-run 2>&1 | tee artifacts/supabase-db-push-dry-run.txt

      - name: Verify production schema before alias normalization
        if: ${{ inputs.mode == 'normalize-alias' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/verify-supabase-production-schema.mjs

      - name: Capture migration history before alias normalization
        if: ${{ inputs.mode == 'normalize-alias' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          supabase migration list --linked 2>&1 | tee artifacts/supabase-migration-list-before-normalize.txt

      - name: Re-verify current main immediately before mutation
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'normalize-alias' }}
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          printf 'mutation_target=%s\ncurrent_main=%s\n' "$TARGET_SHA" "$current_main"
          test "$TARGET_SHA" = "$current_main" || {
            echo 'Main advanced after pre-mutation proof; refusing production migration mutation.' >&2
            exit 1
          }

      - name: Apply production migrations
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          supabase db push --linked 2>&1 | tee artifacts/supabase-db-push-apply.txt

      - name: Normalize canonical applied migration receipt
        if: ${{ inputs.mode == 'normalize-alias' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CANONICAL_VERSION: ${{ inputs.canonical_version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          supabase migration repair "$CANONICAL_VERSION" --status applied --linked 2>&1 | tee artifacts/supabase-migration-normalize-canonical.txt

      - name: Remove superseded execution receipt
        if: ${{ inputs.mode == 'normalize-alias' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          EXECUTION_VERSION: ${{ inputs.execution_version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          supabase migration repair "$EXECUTION_VERSION" --status reverted --linked 2>&1 | tee artifacts/supabase-migration-normalize-execution.txt

      - name: Capture migration history after alias normalization
        if: ${{ inputs.mode == 'normalize-alias' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          supabase migration list --linked 2>&1 | tee artifacts/supabase-migration-list-after-normalize.txt

      - name: Verify normalized history matches repository migration plan
        if: ${{ inputs.mode == 'normalize-alias' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run 2>&1 | tee artifacts/supabase-db-push-dry-run.txt

      - name: Verify exact production schema after mutation
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'normalize-alias' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/verify-supabase-production-schema.mjs

      - name: Retain migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-migration-${{ inputs.mode }}-${{ inputs.target_sha }}
          path: |
            artifacts/supabase-db-push-dry-run.txt
            artifacts/supabase-db-push-apply.txt
            artifacts/supabase-migration-list-before-normalize.txt
            artifacts/supabase-migration-normalize-canonical.txt
            artifacts/supabase-migration-normalize-execution.txt
            artifacts/supabase-migration-list-after-normalize.txt
            artifacts/supabase-production-schema.json
          if-no-files-found: warn
          retention-days: 30
