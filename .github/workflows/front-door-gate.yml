name: Front Door Exact-Head Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - app/index.tsx
      - screens/WebWelcomeScreen.tsx
      - assets/brand/sekret-bip-teen-family-v1.jpg
      - e2e/smoke.spec.ts
      - playwright.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/front-door-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: front-door-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-front-door:
    name: Typecheck and focused Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          printf 'expected_head_sha=%s\nactual_head_sha=%s\nworkflow_run_id=%s\n' \
            "$EXPECTED_HEAD_SHA" "$ACTUAL_HEAD_SHA" "$GITHUB_RUN_ID" \
            | tee test-results/exact-head.txt
          test "$ACTUAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Type-check exact head
        shell: bash
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee test-results/typecheck.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused front-door Playwright contracts
        shell: bash
        run: |
          set -o pipefail
          npx playwright test e2e/smoke.spec.ts \
            --grep "teen splash leads into onboarding welcome|web welcome|frontend entry" \
            --trace on 2>&1 | tee test-results/playwright.log

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-door-evidence-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
