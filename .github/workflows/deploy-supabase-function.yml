name: Deploy Supabase Function

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: Supabase Edge Function to deploy
        required: true
        type: choice
        options:
          - account-deletion-request
          - account-request-cancel
          - account-delete
          - parent-link-revoke
      confirm_project:
        description: Type tbsevonvegdnlyjgplmm to confirm the target project
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-supabase-${{ inputs.function_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Verify project
        shell: bash
        run: |
          if [ "${{ inputs.confirm_project }}" != "tbsevonvegdnlyjgplmm" ]; then
            echo "Project confirmation did not match."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify access token
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }

      - name: Deploy selected function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.function_name }}" = "account-delete" ]; then
            supabase functions deploy "${{ inputs.function_name }}" \
              --project-ref tbsevonvegdnlyjgplmm \
              --no-verify-jwt
          else
            supabase functions deploy "${{ inputs.function_name }}" \
              --project-ref tbsevonvegdnlyjgplmm
          fi

      - name: Summary
        run: echo "Deployed ${{ inputs.function_name }} to tbsevonvegdnlyjgplmm."
