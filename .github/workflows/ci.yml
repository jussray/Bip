name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  core:
    name: Core validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Hydrate LFS assets
        run: git lfs pull

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Oracle discovery tests
        run: npm run test:oracle

      - name: Voice intelligence tests
        run: npm run test:voice-intelligence

      - name: Device sync tests
        run: npm run test:device-sync

      - name: Export Expo web bundle
        id: bundle
        shell: bash
        run: |
          set +e
          npm run verify:bundle > expo-bundle.log 2>&1
          status=$?
          set -e
          tail -n 160 expo-bundle.log
          exit "$status"

      - name: Upload Expo bundle diagnostics
        if: failure() && steps.bundle.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: expo-bundle-diagnostics
          path: expo-bundle.log
          retention-days: 7
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: core
    uses: ./.github/workflows/quality-gate.yml
    with:
      run_vendor_gates: false
