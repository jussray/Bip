name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  control-room-handoff:
    name: Control Room handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify GitHub Actions Control Room policy
        run: node scripts/verify-github-actions-control-room-policy.mjs

      - name: Record GitHub runner sensor evidence
        shell: bash
        run: |
          mkdir -p reports/control-room
          cat > reports/control-room/github-runner-sensor.json <<JSON
          {
            "repository": "${{ github.repository }}",
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref }}",
            "sha": "${{ github.sha }}",
            "classification": "runner_started",
            "role": "manual GitHub Actions sensor",
            "deploymentTruth": "Cloudflare build/deploy logs and exact release markers",
            "repoControlRoom": "Sekret-Bip Control Room collects and classifies evidence",
            "founderAuthority": "Founder Control Room remains the final merge authority"
          }
          JSON
          {
            echo "## GitHub Actions Control Room handoff"
            echo ""
            echo "- Runner started for ${{ github.sha }}."
            echo "- GitHub Actions is manual-only in free-account budget mode."
            echo "- Cloudflare build/deploy logs are the deployment truth source."
            echo "- Sekret-Bip Control Room classifies evidence before Founder Control Room decides."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runner sensor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-runner-sensor
          path: reports/control-room/github-runner-sensor.json
          if-no-files-found: warn
          retention-days: 14
