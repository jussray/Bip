name: Type Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run type check
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run type-check > typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log-final
          path: typecheck.log
          if-no-files-found: error
      - name: Fail when type check failed
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
