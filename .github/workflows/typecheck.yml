name: Type Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply narrow parent-circle row type fix
        if: github.event_name == 'pull_request' && github.head_ref == 'ci-lock-sync-v3'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/utils/sync.ts')
          text = path.read_text()
          old = "(r: ParentCirclePostRow & { created_at: string })"
          new = "(r: Pick<ParentCirclePostRow, 'id' | 'text' | 'reactions' | 'circle_tag'> & { created_at: string })"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/utils/sync.ts
            git commit -m "Fix parent circle feed row typing"
            git push origin HEAD:ci-lock-sync-v3
          fi
      - run: npm ci
      - run: npm run type-check
