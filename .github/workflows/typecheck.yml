name: Type Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@10.9.2
      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set +e
          npm ci > npm-ci.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload npm install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-log
          path: npm-ci.log
          if-no-files-found: error
      - name: Fail when npm ci failed
        if: steps.install.outputs.status != '0'
        run: exit 1
      - run: npm run type-check
