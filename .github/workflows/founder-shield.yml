name: Founder Shield

on:
  pull_request:
    paths:
      - security/firewall-v10.policy.json
      - scripts/verify-firewall-v10.mjs
      - scripts/codeql-pr-alert-proof.mjs
      - worker/auth.ts
      - worker/voice-entry.ts
      - public/_headers
      - test/worker-auth.test.mjs
      - test/front-door-security-telemetry.test.mjs
      - test/cloudflare-worker-consolidation.test.mjs
      - wrangler.toml
      - .dev.vars.example
      - .github/workflows/codeql-pr-alert-proof.yml
      - .github/workflows/product-design-playwright-proof.yml
      - .github/workflows/founder-shield.yml
  push:
    branches:
      - main
    paths:
      - security/firewall-v10.policy.json
      - scripts/verify-firewall-v10.mjs
      - scripts/codeql-pr-alert-proof.mjs
      - worker/auth.ts
      - worker/voice-entry.ts
      - public/_headers
      - test/worker-auth.test.mjs
      - test/front-door-security-telemetry.test.mjs
      - test/cloudflare-worker-consolidation.test.mjs
      - wrangler.toml
      - .dev.vars.example
      - .github/workflows/codeql-pr-alert-proof.yml
      - .github/workflows/product-design-playwright-proof.yml
      - .github/workflows/founder-shield.yml

permissions:
  contents: read

concurrency:
  group: founder-shield-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-founder-shield:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'event=%s\nexpected=%s\nactual=%s\n' "$GITHUB_EVENT_NAME" "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Verify policy against runtime authority
        run: node scripts/verify-firewall-v10.mjs

      - name: Verify auth, CORS, headers, rate-limit, and denial telemetry contracts
        run: node --test test/worker-auth.test.mjs test/front-door-security-telemetry.test.mjs

      - name: Verify Worker authority contract
        run: node --test test/cloudflare-worker-consolidation.test.mjs

  verify-live-edge:
    name: Verify authenticated live edge on main
    if: github.event_name == 'push'
    needs: verify-founder-shield
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: Production
    env:
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Require complete Cloudflare Access service auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCESS_CLIENT_ID"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET"

      - name: Capture authenticated live public edge evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/founder-shield-live

          access_headers=(
            --header "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET"
          )

          pages_headers="$RUNNER_TEMP/founder-shield-sekretbip.headers"
          api_root_headers="$RUNNER_TEMP/founder-shield-api-root.headers"
          api_options_headers="$RUNNER_TEMP/founder-shield-api-options.headers"

          pages_status="$(curl --silent --show-error --location --max-time 20 \
            "${access_headers[@]}" \
            --dump-header "$pages_headers" \
            --output /dev/null \
            --write-out '%{http_code}' \
            https://sekretbip.net/)"

          api_status="$(curl --silent --show-error --max-time 20 \
            "${access_headers[@]}" \
            --dump-header "$api_root_headers" \
            --output /dev/null \
            --write-out '%{http_code}' \
            https://api.sekretbip.net/)"

          options_status="$(curl --silent --show-error --max-time 20 \
            --request OPTIONS \
            "${access_headers[@]}" \
            --header 'Origin: https://sekretbip.net' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type' \
            --dump-header "$api_options_headers" \
            --output /dev/null \
            --write-out '%{http_code}' \
            https://api.sekretbip.net/api/sekret/reply)"

          node - "$pages_headers" "$api_root_headers" "$api_options_headers" <<'NODE'
          const fs = require('node:fs');

          const pairs = [
            [process.argv[2], 'artifacts/founder-shield-live/sekretbip.headers'],
            [process.argv[3], 'artifacts/founder-shield-live/api-root.headers'],
            [process.argv[4], 'artifacts/founder-shield-live/api-options.headers'],
          ];
          const sensitiveHeader = /^(?:set-cookie|cookie|authorization|proxy-authorization|cf-authorization|cf-access-token|cf-access-client-id|cf-access-client-secret):/i;

          for (const [source, destination] of pairs) {
            const input = fs.readFileSync(source, 'utf8');
            const redacted = input
              .split(/\r?\n/u)
              .map((line) => {
                const match = line.match(/^([^:]+):/u);
                return match && sensitiveHeader.test(line) ? `${match[1]}: [REDACTED]` : line;
              })
              .join('\n');
            fs.writeFileSync(destination, `${redacted}\n`, 'utf8');
          }
          NODE

          printf 'pages_status=%s\napi_root_status=%s\napi_options_status=%s\n' \
            "$pages_status" "$api_status" "$options_status" \
            | tee artifacts/founder-shield-live/status.txt

          test "$pages_status" -ge 200
          test "$pages_status" -lt 400
          test "$api_status" -ne 000
          test "$api_status" -lt 500
          test "$options_status" -ne 000
          test "$options_status" -lt 500

      - name: Upload live edge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: founder-shield-live-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/founder-shield-live
          if-no-files-found: ignore
          retention-days: 30
