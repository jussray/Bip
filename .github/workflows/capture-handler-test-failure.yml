name: Capture handler test failure

on:
  push:
    branches:
      - agent/frontend-handler-contracts

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-handler-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Capture full test result
        shell: bash
        run: |
          set +e
          npm test > /tmp/npm-test.log 2>&1
          status=$?
          mkdir -p debug
          {
            echo "exit_status=$status"
            echo
            echo "=== failure markers ==="
            grep -nE "not ok|fail|AssertionError|ERR_|Error:" /tmp/npm-test.log | tail -n 120 || true
            echo
            echo "=== final 240 lines ==="
            tail -n 240 /tmp/npm-test.log
          } > debug/frontend-handler-test-failure.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/capture-handler-test-failure.yml
          git add debug/frontend-handler-test-failure.txt
          git commit -m "chore: capture handler test failure"
          git push origin HEAD:agent/frontend-handler-contracts
