name: Apply Piper Screen Routing Fix

on:
  push:
    branches: [fix-piper-screen-routing]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-piper-screen-routing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/(teen)/pages/[id].tsx')
          s = p.read_text()
          s = s.replace("const COMPANION_META: Record<string, { label: string; accent: string; emoji: string; avatarId: SekretCharacterId }> = {", "const COMPANION_META: Record<string, { label: string; accent: string; emoji: string; avatarId: SekretCharacterId | null }> = {")
          s = s.replace("  me:      { label: 'Me',      accent: '#b8a9c9', emoji: '🪞', avatarId: 'raylene' },", "  me:      { label: 'Me',      accent: '#b8a9c9', emoji: '🪞', avatarId: null },")
          s = s.replace("  oracle:  { label: 'Oracle',  accent: '#c7b87a', emoji: '🔮', avatarId: 'raylene' },", "  oracle:  { label: 'Oracle',  accent: '#c7b87a', emoji: '🔮', avatarId: null },")
          s = s.replace("avatarId: 'raylene' as SekretCharacterId,", "avatarId: null,")
          s = s.replace("if (!entry?.sekretReply || !companion || voiceLoading) return;", "if (!entry?.sekretReply || !companion?.avatarId || voiceLoading) return;")
          s = s.replace("{entry.sekretReply ? (", "{entry.sekretReply ? (")
          s = s.replace("                <TouchableOpacity\n                  onPress={playReply}", "                {companion.avatarId ? (\n                <TouchableOpacity\n                  onPress={playReply}")
          s = s.replace("                </TouchableOpacity>\n                <TouchableOpacity style={[s.quickReplyBtn", "                </TouchableOpacity>\n                ) : null}\n                <TouchableOpacity style={[s.quickReplyBtn")
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: |
          rm .github/workflows/apply-piper-screen-routing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/'(teen)'/pages/'[id].tsx' .github/workflows/apply-piper-screen-routing.yml
          git commit -m "fix: restrict Piper playback to AI companions"
          git push
