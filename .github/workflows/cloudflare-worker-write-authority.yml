name: Apply Cloudflare Worker Write Authority

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA authorized for Worker control-plane repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-write-authority-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BIP_WORKER_NAME: sekret-backend
  BIP_WORKER_BUILD_COMMAND: ''
  BIP_WORKER_DEPLOY_COMMAND: npm run deploy:api:production
  BIP_WORKER_BUILD_COMMIT: ${{ inputs.target_sha }}
  CLOUDFLARE_BUILD_EVIDENCE_PATH: artifacts/cloudflare-worker-write-authority.json

jobs:
  apply:
    name: Apply exact-main Worker trigger repair with write credential
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ inputs.target_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require exact current main before provider credential use
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'target_sha must be a full 40-character commit SHA.' >&2
            exit 1
          }
          current_main="$({
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/commits/main"
          } | node -e "let body='';process.stdin.on('data',c=>body+=c);process.stdin.on('end',()=>{const parsed=JSON.parse(body);if(!parsed.sha)process.exit(2);process.stdout.write(parsed.sha);});")"
          printf 'requested=%s\ncurrent_main=%s\n' "$EXPECTED_HEAD_SHA" "$current_main"
          test "$EXPECTED_HEAD_SHA" = "$current_main" || {
            echo 'Refusing Worker write authority for a target that is not exact current main.' >&2
            exit 1
          }

      - name: Check out exact authorized main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify checked-out head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Require write-capable Cloudflare credential inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo 'CLOUDFLARE_API_TOKEN is required for Worker write authority.' >&2
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo 'CLOUDFLARE_ACCOUNT_ID is required for Worker write authority.' >&2
            exit 1
          }

      - name: Apply, verify, and request exact native Worker build
        env:
          CLOUDFLARE_WORKERS_BUILDS_API_TOKEN: ''
        run: node scripts/reconcile-cloudflare-workers-build-trigger.mjs --apply

      - name: Upload write-authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-worker-write-authority-${{ github.run_id }}
          path: ${{ env.CLOUDFLARE_BUILD_EVIDENCE_PATH }}
          if-no-files-found: warn
          retention-days: 30
