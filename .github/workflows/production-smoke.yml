name: Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'playwright.production.config.ts'
      - 'e2e/production-*.spec.ts'
      - 'test/production-smoke-target-contract.test.mjs'
  workflow_dispatch:
    inputs:
      base_url:
        description: "Frontend URL to verify before a production domain cutover"
        required: false
        default: "https://sekretbip.net"
        type: string
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify production frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only smoke checks against the selected live domain
        env:
          PRODUCTION_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://app.sekretbip.net' || inputs.base_url || 'https://sekretbip.net' }}
        run: npx playwright test --config=playwright.production.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: playwright-report-production/
          if-no-files-found: ignore
          retention-days: 7
