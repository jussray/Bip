name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: 'Exact deployed main SHA to prove'
        required: true
        type: string
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_release_sha || github.event.workflow_run.head_sha }}

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify sekretbip.net
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out exact proof source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_RELEASE_SHA }}
          persist-credentials: false

      - name: Record and verify exact proof source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_RELEASE_SHA" "$actual"
          test "$actual" = "$EXPECTED_RELEASE_SHA"

      - name: Require production proof to target main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only exact-release checks against the live domain
        run: npx playwright test --config=playwright.production.config.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ env.EXPECTED_RELEASE_SHA }}
          path: |
            playwright-report-production/
            test-results/
          if-no-files-found: warn
          retention-days: 14
