name: Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'playwright.production.config.ts'
      - 'e2e/production-public-front-door.spec.ts'
      - 'e2e/production-smoke.spec.ts'
      - 'e2e/production-audience-journeys.spec.ts'
      - 'e2e/production-auth-reachability.spec.ts'
      - 'e2e/production-password-recovery.spec.ts'
      - 'e2e/production-signup-transport.spec.ts'
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: production-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify public production front doors
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only smoke checks against live public domains
        run: npx playwright test --config=playwright.production.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-smoke-report-${{ env.EXPECTED_HEAD_SHA }}
          path: playwright-report-production/
          if-no-files-found: ignore
          retention-days: 7
