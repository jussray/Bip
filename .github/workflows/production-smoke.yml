name: Production Smoke

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Verify Cloudflare Native Deployment"]
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: production-smoke-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify public production front doors
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Require successful upstream production verification job
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          jobs_json="$({
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/jobs?per_page=100"
          })"

          UPSTREAM_HEAD_SHA="$UPSTREAM_HEAD_SHA" node -e '
            const payload = JSON.parse(process.argv[1]);
            const target = payload.jobs?.find(
              (job) => job.name === "Verify exact frontend Worker, backend Worker, and release"
            );
            if (!target) {
              console.error("Required upstream production verification job did not run.");
              process.exit(2);
            }
            if (target.conclusion !== "success") {
              console.error(`Required upstream production verification job concluded ${target.conclusion}.`);
              process.exit(3);
            }
            console.log(`verified_upstream_job=${target.name}`);
            console.log(`verified_release_sha=${process.env.UPSTREAM_HEAD_SHA}`);
          ' "$jobs_json"

      - name: Check out exact verified source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only smoke checks against live public domains
        run: npx playwright test --config=playwright.production.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-smoke-report-${{ env.EXPECTED_HEAD_SHA }}
          path: playwright-report-production/
          if-no-files-found: ignore
          retention-days: 7
