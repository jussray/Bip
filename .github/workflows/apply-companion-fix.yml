name: Finalize Companion Fix

on:
  push:
    branches: [fix-companion-replies-clean]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-companion-replies-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Align invite tests with protected RPCs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/parent-linking.test.mjs')
          s = p.read_text()
          s = s.replace("const approvalSql = fs.readFileSync(new URL('../supabase/migrations/20260630001000_account_verification_parent_approval.sql', import.meta.url), 'utf8');", "const createSql = fs.readFileSync(new URL('../supabase/migrations/20260630002000_limited_mode_parent_invite.sql', import.meta.url), 'utf8');\nconst approvalSql = fs.readFileSync(new URL('../supabase/migrations/20260630001000_account_verification_parent_approval.sql', import.meta.url), 'utf8');")
          start = s.index("const randomCodeBody =")
          end = s.index("test('redeemInviteCode uses the protected server-authoritative RPC'")
          replacement = '''test('generateInviteCode uses the protected server-authoritative RPC', () => {\n  assert.match(linkSrc, /\\.rpc\\('create_parent_link_invite'\\)/);\n  assert.doesNotMatch(linkSrc, /Math\\.random|\\.from\\('parent_links'\\).*insert/s);\n});\n\ntest('invite creation RPC creates a six-character uppercase code', () => {\n  assert.match(createSql, /upper\\(substr\\(md5\\(gen_random_uuid\\(\\)::text\\), 1, 6\\)\\)/);\n});\n\ntest('invite creation RPC revokes older pending invites', () => {\n  assert.match(createSql, /set status = 'revoked'[\\s\\S]*status = 'pending'/);\n});\n\ntest('invite creation RPC creates a pending invite expiring in 48 hours', () => {\n  assert.match(createSql, /'pending'/);\n  assert.match(createSql, /interval '48 hours'/);\n});\n\ntest('invite creation RPC moves verification into PENDING_PARENT', () => {\n  assert.match(createSql, /'PENDING_PARENT'/);\n  assert.match(createSql, /parent_invite_created/);\n});\n\n'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: |
          rm -f companion-test-output.txt
          rm .github/workflows/apply-companion-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/parent-linking.test.mjs companion-test-output.txt .github/workflows/apply-companion-fix.yml
          git commit -m "test: align parent linking with protected RPCs"
          git push
