name: Debug Reset Typecheck Output

on:
  push:
    branches:
      - feature/mind-body-reset-workouts

jobs:
  capture-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture compiler output
        shell: bash
        run: |
          set +e
          npm run type-check > typecheck.log 2>&1
          status=$?
          echo "$status" > typecheck.exit
          cat typecheck.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: reset-typecheck-output
          path: |
            typecheck.log
            typecheck.exit
          if-no-files-found: error
