name: Apply Companion Reply Polish

on:
  push:
    branches: [polish-companion-replies]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-companion-replies
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-companion-reply-polish.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/sekret-reply.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(companions): polish production reply behavior"
          git push
