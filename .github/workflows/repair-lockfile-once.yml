name: Repair lockfile once

on:
  push:
    branches:
      - feat/goal-10-playwright-control-room
    paths:
      - .github/workflows/repair-lockfile-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/goal-10-playwright-control-room
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pin repository npm version
        run: npm install --global npm@10.9.2

      - name: Regenerate package lock from current manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove one-shot workflow and commit result
        run: |
          rm .github/workflows/repair-lockfile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/repair-lockfile-once.yml
          git diff --cached --quiet && { echo "Expected a lockfile repair but no change was produced."; exit 1; }
          git commit -m "chore: reconcile package lock with current manifest"
          git push origin HEAD:feat/goal-10-playwright-control-room
