name: Diagnose Parent Entry Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture failing test output
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          {
            grep -n -E 'not ok|AssertionError|ERR_ASSERTION|fail [0-9]+|tests [0-9]+' test-output.txt || true
            echo '--- FINAL 320 LINES ---'
            tail -n 320 test-output.txt
          } > test-diagnostic.txt
          echo "$status" > test-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: parent-entry-test-diagnostic
          path: |
            test-diagnostic.txt
            test-status.txt
          retention-days: 1
