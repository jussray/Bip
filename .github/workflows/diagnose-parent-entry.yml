name: Diagnose Parent Entry Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture failing test tail
        shell: bash
        run: |
          set +e
          npm test > parent-entry-test-output.txt 2>&1
          status=$?
          tail -n 240 parent-entry-test-output.txt > parent-entry-test-tail.txt
          echo "$status" > parent-entry-test-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: parent-entry-test-diagnostic
          path: |
            parent-entry-test-tail.txt
            parent-entry-test-status.txt
          retention-days: 1
