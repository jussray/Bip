name: Verify Cloudflare Native Deployment

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'app.config.ts'
      - 'app.json'
      - 'screens/**'
      - 'assets/**'
      - 'src/**'
      - 'worker/**'
      - 'scripts/bootstrap-release-metadata-source.mjs'
      - 'scripts/write-release-metadata.mjs'
      - 'scripts/write-worker-release-identity.mjs'
      - 'scripts/reconcile-cloudflare-workers-build-trigger.mjs'
      - 'scripts/verify-cloudflare-native-deploy.mjs'
      - 'scripts/publish-production-release-observation.mjs'
      - 'test/cloudflare-pages-build-environment.test.mjs'
      - 'test/release-metadata-bootstrap.test.mjs'
      - 'test/release-metadata.test.mjs'
      - 'test/production-worker-release-witness.test.mjs'
      - 'e2e/production-smoke.spec.ts'
      - 'playwright.production.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-workers-build-trigger.yml'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/production-gate-contract.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact release commit to reconcile after a partial or interrupted deployment
        required: false
        type: string

concurrency:
  group: cloudflare-native-production-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOYMENT_SHA: ${{ inputs.target_sha || github.sha }}

jobs:
  verify-native-deployment:
    name: Verify exact frontend Worker, backend Worker, and release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_CHECK_TIMEOUT_MS: '1800000'
      CLOUDFLARE_CHECK_POLL_MS: '10000'
      CLOUDFLARE_EVIDENCE_PATH: artifacts/cloudflare-native-deploy.json
      PRODUCTION_BASE_URL: https://sekretbip.net
      FRONTEND_RELEASE_URL: https://sekretbip.net/.well-known/sekret-release.json
      BACKEND_HEALTH_URL: https://api.sekretbip.net/health
      SUPABASE_RUNTIME_HEALTH_URL: https://tbsevonvegdnlyjgplmm.supabase.co/functions/v1/runtime-contract-health
      EXPECTED_RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
      RELEASE_OBSERVATION_ISSUE: '696'
    steps:
      - name: Check out release commit under verification
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}

      - name: Record and verify exact target head
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_RELEASE_SHA" "$actual"
          test "$actual" = "$EXPECTED_RELEASE_SHA"

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        id: install
        run: npm ci

      - name: Wait for exact frontend and backend Worker checks plus release marker
        id: cloudflare_release
        env:
          GITHUB_SHA: ${{ env.DEPLOYMENT_SHA }}
        run: node scripts/verify-cloudflare-native-deploy.mjs

      - name: Verify backend health
        id: backend_health
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$BACKEND_HEALTH_URL"

      - name: Verify Supabase runtime contracts
        id: supabase_health
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$SUPABASE_RUNTIME_HEALTH_URL"

      - name: Install Chromium
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact deployed frontend with Playwright
        id: production_playwright
        run: npm run test:e2e:production

      - name: Upload deployment evidence
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-native-deployment-evidence-${{ env.DEPLOYMENT_SHA }}
          path: |
            artifacts/cloudflare-native-deploy.json
            playwright-report-production/
            test-results-production/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish exact production release observation
        if: success()
        run: node scripts/publish-production-release-observation.mjs

      - name: Publish blocked exact production observation
        if: failure()
        env:
          RELEASE_OBSERVATION_MODE: blocked
          VERIFICATION_JOB_STATUS: failure
          RELEASE_STEP_OUTCOMES: >-
            {"checkout":"${{ steps.checkout.outcome }}","exact_head":"${{ steps.exact_head.outcome }}","setup_node":"${{ steps.setup_node.outcome }}","install":"${{ steps.install.outcome }}","cloudflare_release":"${{ steps.cloudflare_release.outcome }}","backend_health":"${{ steps.backend_health.outcome }}","supabase_health":"${{ steps.supabase_health.outcome }}","chromium":"${{ steps.chromium.outcome }}","production_playwright":"${{ steps.production_playwright.outcome }}","upload_evidence":"${{ steps.upload_evidence.outcome }}"}
        run: node scripts/publish-production-release-observation.mjs
