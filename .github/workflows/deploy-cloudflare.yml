name: Verify Cloudflare Native Deployment

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'app.config.ts'
      - 'app.json'
      - 'screens/**'
      - 'assets/**'
      - 'src/**'
      - 'worker/**'
      - 'supabase/migrations/**'
      - 'scripts/bootstrap-release-metadata-source.mjs'
      - 'scripts/write-release-metadata.mjs'
      - 'scripts/write-worker-release-identity.mjs'
      - 'scripts/reconcile-cloudflare-workers-build-trigger.mjs'
      - 'scripts/verify-cloudflare-native-deploy.mjs'
      - 'scripts/verify-supabase-production-schema.mjs'
      - 'scripts/publish-production-release-observation.mjs'
      - 'test/cloudflare-pages-build-environment.test.mjs'
      - 'test/release-metadata-bootstrap.test.mjs'
      - 'test/release-metadata.test.mjs'
      - 'test/production-worker-release-witness.test.mjs'
      - 'test/supabase-production-schema-witness.test.mjs'
      - 'e2e/production-smoke.spec.ts'
      - 'playwright.production.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-workers-build-trigger.yml'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/production-gate-contract.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current-main release commit to reconcile after a partial or interrupted deployment
        required: false
        type: string

concurrency:
  group: cloudflare-native-production-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOYMENT_SHA: ${{ inputs.target_sha || github.sha }}

jobs:
  verify-native-deployment:
    name: Verify exact frontend Worker, backend Worker, and release
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_CHECK_TIMEOUT_MS: '1800000'
      CLOUDFLARE_CHECK_POLL_MS: '10000'
      CLOUDFLARE_EVIDENCE_PATH: artifacts/cloudflare-native-deploy.json
      PRODUCTION_BASE_URL: https://sekretbip.net
      FRONTEND_RELEASE_URL: https://sekretbip.net/.well-known/sekret-release.json
      BACKEND_HEALTH_URL: https://api.sekretbip.net/health
      SUPABASE_RUNTIME_HEALTH_URL: https://tbsevonvegdnlyjgplmm.supabase.co/functions/v1/runtime-contract-health
      SUPABASE_PROJECT_REF: tbsevonvegdnlyjgplmm
      SUPABASE_SCHEMA_EVIDENCE_PATH: artifacts/supabase-production-schema.json
      EXPECTED_RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
      RELEASE_OBSERVATION_ISSUE: '696'
    steps:
      - name: Validate trusted release target before checkout
        id: trusted_target
        shell: bash
        env:
          TARGET_SHA: ${{ env.DEPLOYMENT_SHA }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'Deployment target must be a full 40-character commit SHA.' >&2
            exit 1
          }

          current_main="$({
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/commits/main"
          } | node -e "let body='';process.stdin.on('data',c=>body+=c);process.stdin.on('end',()=>{const parsed=JSON.parse(body);if(!parsed.sha)process.exit(2);process.stdout.write(parsed.sha);});")"

          printf 'requested=%s\ncurrent_main=%s\n' "$TARGET_SHA" "$current_main"
          test "$TARGET_SHA" = "$current_main" || {
            echo 'Refusing to expose Production-scoped secrets to a target that is not current main.' >&2
            exit 1
          }

      - name: Check out release commit under verification
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}

      - name: Record and verify exact target head
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_RELEASE_SHA" "$actual"
          test "$actual" = "$EXPECTED_RELEASE_SHA"

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        id: install
        run: npm ci

      - name: Verify exact Supabase production schema contract
        id: supabase_schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/verify-supabase-production-schema.mjs

      - name: Wait for exact frontend and backend Worker checks plus release marker
        id: cloudflare_release
        env:
          GITHUB_SHA: ${{ env.DEPLOYMENT_SHA }}
        run: node scripts/verify-cloudflare-native-deploy.mjs

      - name: Verify backend health
        id: backend_health
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$BACKEND_HEALTH_URL"

      - name: Verify Supabase runtime contracts
        id: supabase_health
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$SUPABASE_RUNTIME_HEALTH_URL"

      - name: Install Chromium
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact deployed frontend with Playwright
        id: production_playwright
        run: npm run test:e2e:production

      - name: Upload deployment evidence
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-native-deployment-evidence-${{ env.DEPLOYMENT_SHA }}
          path: |
            artifacts/cloudflare-native-deploy.json
            artifacts/supabase-production-schema.json
            playwright-report-production/
            test-results-production/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish exact production release observation
        if: success()
        run: node scripts/publish-production-release-observation.mjs

      - name: Publish blocked exact production observation
        if: failure()
        env:
          RELEASE_OBSERVATION_MODE: blocked
          VERIFICATION_JOB_STATUS: failure
          RELEASE_STEP_OUTCOMES: >-
            {"trusted_target":"${{ steps.trusted_target.outcome }}","checkout":"${{ steps.checkout.outcome }}","exact_head":"${{ steps.exact_head.outcome }}","setup_node":"${{ steps.setup_node.outcome }}","install":"${{ steps.install.outcome }}","cloudflare_release":"${{ steps.cloudflare_release.outcome }}","supabase_schema":"${{ steps.supabase_schema.outcome }}","backend_health":"${{ steps.backend_health.outcome }}","supabase_health":"${{ steps.supabase_health.outcome }}","chromium":"${{ steps.chromium.outcome }}","production_playwright":"${{ steps.production_playwright.outcome }}","upload_evidence":"${{ steps.upload_evidence.outcome }}"}
        run: node scripts/publish-production-release-observation.mjs
