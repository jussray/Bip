name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-worker:
    name: Deploy Backend Worker (sekret-backend)
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify canonical Worker configuration
        run: |
          grep -Eq '^name = "sekret-backend"$' wrangler.toml
          grep -Eq '^main = "worker/observed-index.ts"$' wrangler.toml
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy backend Worker sekret-backend
        id: deploy_worker
        continue-on-error: true
        run: |
          mkdir -p artifacts/cloudflare
          set -o pipefail
          npm run deploy:worker 2>&1 | tee artifacts/cloudflare/worker-deploy.log
      - name: Upload Worker deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-deploy-log
          path: artifacts/cloudflare/worker-deploy.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce Worker deployment result
        if: steps.deploy_worker.outcome != 'success'
        run: exit 1

  deploy-pages:
    name: Deploy Frontend Pages (sekret)
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      CLOUDFLARE_PAGES_PROJECT_NAME: sekret
      SEKRET_FRONTEND_URL: ${{ vars.SEKRET_FRONTEND_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
      APP_ENV: production
      EXPO_PUBLIC_ENABLE_FOUNDER_TOOLS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify frontend deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$CLOUDFLARE_PAGES_PROJECT_NAME" = "sekret"
          test -n "$SEKRET_FRONTEND_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$EXPO_PUBLIC_BACKEND_URL"
      - name: Build Expo web frontend
        run: npm run build:web
      - name: Deploy Expo web export to Cloudflare Pages project sekret
        id: deploy_pages
        continue-on-error: true
        run: |
          mkdir -p artifacts/cloudflare
          set -o pipefail
          npx wrangler pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch=main 2>&1 | tee artifacts/cloudflare/pages-deploy.log
      - name: Upload Pages deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-deploy-log
          path: artifacts/cloudflare/pages-deploy.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce Pages deployment result
        if: steps.deploy_pages.outcome != 'success'
        run: exit 1
      - name: Verify custom-domain frontend health
        run: curl --fail-with-body --silent --show-error --location "$SEKRET_FRONTEND_URL"
