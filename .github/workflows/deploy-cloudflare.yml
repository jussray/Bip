name: Verify Cloudflare Native Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-native-production
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-native-deployment:
    name: Verify exact Worker and Pages release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_CHECK_TIMEOUT_MS: '1800000'
      CLOUDFLARE_CHECK_POLL_MS: '10000'
      CLOUDFLARE_EVIDENCE_PATH: artifacts/cloudflare-native-deploy.json
      PRODUCTION_BASE_URL: https://sekretbip.net
      FRONTEND_RELEASE_URL: https://sekretbip.net/release.json
      BACKEND_HEALTH_URL: https://sekret-backend.mcgill-raylene.workers.dev/health
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Wait for exact Worker check and Pages release marker
        run: node scripts/verify-cloudflare-native-deploy.mjs

      - name: Verify backend health
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$BACKEND_HEALTH_URL"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact deployed frontend with Playwright
        run: npm run test:e2e:production

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-native-deployment-evidence
          path: |
            artifacts/cloudflare-native-deploy.json
            playwright-report-production/
          if-no-files-found: warn
          retention-days: 14
