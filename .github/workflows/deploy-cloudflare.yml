name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-worker:
    name: Deploy Backend Worker (bip)
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy backend Worker bip
        run: npm run deploy:worker
      - name: Record release health
        env:
          RELEASE_HEALTH_WEBHOOK_URL: ${{ vars.RELEASE_HEALTH_WEBHOOK_URL }}
        run: |
          test -n "$RELEASE_HEALTH_WEBHOOK_URL"
          TOKEN_RESPONSE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sekret-bip-release-health")
          OIDC_TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).value))")
          curl --fail-with-body --silent --show-error \
            -X POST "$RELEASE_HEALTH_WEBHOOK_URL" \
            -H "authorization: Bearer $OIDC_TOKEN" \
            -H "content-type: application/json" \
            --data "{\"commit_sha\":\"$GITHUB_SHA\",\"branch\":\"$GITHUB_REF_NAME\",\"workflow_run_id\":\"$GITHUB_RUN_ID\"}"

  deploy-pages:
    name: Deploy Frontend Pages (sekret)
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      CLOUDFLARE_PAGES_PROJECT_NAME: sekret
      SEKRET_FRONTEND_URL: ${{ vars.SEKRET_FRONTEND_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
      APP_ENV: production
      EXPO_PUBLIC_ENABLE_FOUNDER_TOOLS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify frontend deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$CLOUDFLARE_PAGES_PROJECT_NAME" = "sekret"
          test -n "$SEKRET_FRONTEND_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$EXPO_PUBLIC_BACKEND_URL"
      - name: Build Expo web frontend
        run: npm run build:web
      - name: Deploy Expo web export to Cloudflare Pages project sekret
        run: npx wrangler pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch=main
      - name: Verify custom-domain frontend health
        run: curl --fail-with-body --silent --show-error --location "$SEKRET_FRONTEND_URL"
