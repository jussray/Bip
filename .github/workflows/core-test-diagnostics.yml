name: Core Test Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Capture failing test names
        id: capture
        shell: bash
        run: |
          set +e
          mapfile -t TESTS < <(find test -type f -name '*.test.mjs' | sort)
          node --test --test-reporter=tap "${TESTS[@]}" > /tmp/core.tap 2>&1
          STATUS=$?
          grep -n '^not ok' /tmp/core.tap > /tmp/failures.log
          if [ ! -s /tmp/failures.log ]; then echo '(no failing test name found)' > /tmp/failures.log; fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Post core diagnostics
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.capture.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/failures.log', 'utf8');
            const marker = '<!-- core-test-diagnostics -->';
            const body = `${marker}\n## Core test diagnostics\n\n**Core suite:** ${process.env.STATUS === '0' ? 'passed' : 'failed'}\n\n\`\`\`text\n${output}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - name: Enforce result
        shell: bash
        run: test "${{ steps.capture.outputs.status }}" = "0"
