name: One-time calm handler follow-up

on:
  push:
    branches:
      - agent/frontend-handler-contracts

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frontend-handler-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Wire remaining active calm rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('screens/CalmScreen.tsx')
          text = path.read_text()
          old = """        {MORE_BREATHING.map(item => (\n          <View key={item.label} style={[styles.listRow, { backgroundColor: t.card, borderColor: t.accent }]}>\n            <Image source={CLOUD_HEADPHONES} style={styles.listRowIcon} resizeMode=\"contain\" />\n            <View style={{ flex: 1 }}>\n              <Text style={[styles.listRowTitle, { color: '#fff' }]}>{item.label}</Text>\n              <Text style={[styles.listRowSub, { color: t.soft }]}>{item.sub}</Text>\n            </View>\n            <Text style={[styles.listRowDur, { color: t.soft }]}>{item.duration}</Text>\n            <Text style={{ color: t.soft }}>›</Text>\n          </View>\n        ))}"""
          new = """        {MORE_BREATHING.map(item => (\n          <TouchableOpacity\n            key={item.label}\n            style={[styles.listRow, { backgroundColor: t.card, borderColor: t.accent }]}\n            onPress={() => onOpenBreathe ? onOpenBreathe() : Alert.alert('Breathing exercises', 'Open the full breathing screen to choose this exercise.')}\n          >\n            <Image source={CLOUD_HEADPHONES} style={styles.listRowIcon} resizeMode=\"contain\" />\n            <View style={{ flex: 1 }}>\n              <Text style={[styles.listRowTitle, { color: '#fff' }]}>{item.label}</Text>\n              <Text style={[styles.listRowSub, { color: t.soft }]}>{item.sub}</Text>\n            </View>\n            <Text style={[styles.listRowDur, { color: t.soft }]}>{item.duration}</Text>\n            <Text style={{ color: t.soft }}>›</Text>\n          </TouchableOpacity>\n        ))}"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one More Breathing block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('test/frontend-handler-contract.test.mjs')
          test = test_path.read_text()
          old_test = "  assert.match(source, /CALM_PLAYLIST[\\s\\S]*TouchableOpacity/);\n"
          new_test = "  assert.match(source, /MORE_BREATHING[\\s\\S]*TouchableOpacity/);\n  assert.match(source, /CALM_PLAYLIST[\\s\\S]*TouchableOpacity/);\n"
          if test.count(old_test) != 1:
              raise SystemExit('handler contract assertion anchor missing')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
      - run: npm ci --legacy-peer-deps
      - run: node --test test/frontend-handler-contract.test.mjs test/screen-purpose-parity.test.mjs
      - run: npm run type-check
      - name: Commit follow-up
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/frontend-handler-followup.yml
          git add screens/CalmScreen.tsx test/frontend-handler-contract.test.mjs
          git commit -m "fix: wire remaining calm exercise handlers"
          git push origin HEAD:agent/frontend-handler-contracts
