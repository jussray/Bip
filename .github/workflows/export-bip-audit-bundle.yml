name: Export Bip audit source bundle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build Claude audit bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          paths = [
              'app/_layout.tsx',
              'app/(teen)/companion-chat.tsx',
              'src/features/sekret/companionEngine.ts',
              'src/services/ai/buildReplyRequest.ts',
              'src/utils/api.ts',
              'src/contracts/sekretApi.ts',
              'services/sekretVoice.ts',
              'worker/sekret-reply.ts',
              'src/services/ai/personalities.ts',
              'src/config/companionCurriculum.ts',
              'components/BackgroundLayer.tsx',
              'constants/theme.ts',
              'package.json',
              'app.config.ts',
              'app.json',
          ]

          source_commit = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          bundle_dir = Path('bip-audit-artifact')
          raw_dir = bundle_dir / 'raw-files'
          raw_dir.mkdir(parents=True, exist_ok=True)

          out = [
              '# Se’kret Bip — Claude Audit Source Bundle',
              '',
              f'- Repository: `jussray/Sekret-Bip`',
              f'- Source commit: `{source_commit}`',
              '- Generated by a temporary read-only GitHub Actions export.',
              '- Files are copied verbatim; line numbers inside each section start at 1.',
              '',
              '## Manifest',
              '',
              '| # | File | Lines | SHA-256 |',
              '|---:|---|---:|---|',
          ]

          loaded = []
          for index, path_str in enumerate(paths, start=1):
              path = Path(path_str)
              if not path.is_file():
                  raise SystemExit(f'Missing required file: {path_str}')
              data = path.read_bytes()
              text = data.decode('utf-8')
              line_count = len(text.splitlines())
              digest = hashlib.sha256(data).hexdigest()
              out.append(f'| {index} | `{path_str}` | {line_count} | `{digest}` |')
              loaded.append((index, path_str, text, data))

              target = raw_dir / path_str
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          for index, path_str, text, _ in loaded:
              extension = Path(path_str).suffix.lower()
              language = {
                  '.ts': 'typescript',
                  '.tsx': 'tsx',
                  '.json': 'json',
              }.get(extension, 'text')
              longest = 3
              run = 0
              for char in text:
                  if char == '`':
                      run += 1
                      longest = max(longest, run + 1)
                  else:
                      run = 0
              fence = '`' * longest
              out.extend([
                  '',
                  f'## {index}. `{path_str}`',
                  '',
                  f'{fence}{language}',
                  text.rstrip('\n'),
                  fence,
              ])

          bundle = '\n'.join(out) + '\n'
          (bundle_dir / 'bip-audit-source-bundle.md').write_text(bundle, encoding='utf-8')
          (bundle_dir / 'SOURCE_COMMIT.txt').write_text(source_commit + '\n', encoding='utf-8')
          PY

      - name: Upload audit source bundle
        uses: actions/upload-artifact@v4
        with:
          name: bip-audit-source-bundle
          path: bip-audit-artifact
          if-no-files-found: error
          retention-days: 1
