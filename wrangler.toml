# wrangler.toml
# Replaces wrangler.jsonc — TOML avoids JSON comment-parsing failures in CF builds.
#
# ── Cloudflare Worker secrets ─────────────────────────────────────────
#   This Worker currently needs only:
#     wrangler secret put OPENAI_API_KEY --name bip
#
#   Do NOT put Supabase service-role or safety-scan secrets in Cloudflare
#   unless Worker code starts using them. The safety scanner is a Supabase
#   Edge Function and its secrets are set with `supabase secrets set`.
#
# ── Local development ──────────────────────────────────────────────────
#   Copy .dev.vars.example → .dev.vars and fill in real values.
#   .dev.vars is gitignored and is used by `wrangler dev` automatically.
#
# ── Deploy ──────────────────────────────────────────────────────────
#   wrangler secret put OPENAI_API_KEY --name bip
#   wrangler deploy --name bip

name               = "bip"
main               = "worker/index.ts"
compatibility_date = "2026-06-13"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ── Non-secret config vars (safe to commit) ──────────────────────────────
# OPENAI_API_KEY must be set via `wrangler secret put` — never in this file.
[vars]
# OpenAI model names — rotate without code changes by updating this file.
OPENAI_CHAT_MODEL      = "gpt-4o-mini"
OPENAI_TTS_MODEL       = "gpt-4o-mini-tts"
OPENAI_STT_MODEL       = "whisper-1"

# Connected Supabase project. The Worker currently does not use the anon key.
SUPABASE_URL      = "https://jvmbhralyktmdlvglrxk.supabase.co"

# Audio upload limit in bytes (base64 decoded size cap).
# 512 KB ≈ ~30s of compressed voice at typical Expo AudioRecording settings.
AUDIO_MAX_BYTES   = "524288"

# Routes block commented out for beta — using auto-assigned *.workers.dev URL.
# Un-comment and set EXPO_PUBLIC_BACKEND_URL to your custom domain once live.
#
# [[routes]]
# pattern   = "api.bipapp.com/api/sekret/reply"
# zone_name = "bipapp.com"
