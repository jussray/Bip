# wrangler.toml
# Replaces wrangler.jsonc — TOML avoids JSON comment-parsing failures in CF builds.
#
# ── Cloudflare Worker secrets ─────────────────────────────────────────
#   This Worker needs:
#     wrangler secret put OPENAI_API_KEY --name bip
#     wrangler secret put SEKRET_CLIENT_TOKEN --name bip   # shared client auth
#
#   SEKRET_CLIENT_TOKEN gates /api/* routes: the app must send a matching
#   `Authorization: Bearer <token>` (EXPO_PUBLIC_BACKEND_TOKEN on the client).
#   While the secret is unset, auth is disabled (fail-open) so existing builds
#   keep working — set it on Cloudflare AND in the app build to turn enforcement
#   on. It is a coarse abuse speed-bump; Workers rate limiting (below) is what
#   actually bounds cost.
#
#   Per-user auth: signed-in clients send their Supabase access token instead of
#   the shared token. The Worker verifies it against the project JWKS derived
#   from SUPABASE_URL (below) — no secret needed for asymmetric-JWT projects
#   (the default). For legacy HS256 projects, set the signing secret:
#     wrangler secret put SUPABASE_JWT_SECRET --name bip
#   Enforcement is still gated on SEKRET_CLIENT_TOKEN; a valid JWT is always
#   accepted as a per-user identity and used as the rate-limit key.
#
#   Do NOT put Supabase service-role or safety-scan secrets in Cloudflare
#   unless Worker code starts using them. The safety scanner is a Supabase
#   Edge Function and its secrets are set with `supabase secrets set`.
#
# ── Local development ──────────────────────────────────────────────────
#   Copy .dev.vars.example → .dev.vars and fill in real values.
#   .dev.vars is gitignored and is used by `wrangler dev` automatically.
#
# ── Deploy ──────────────────────────────────────────────────────────
#   wrangler secret put OPENAI_API_KEY --name bip
#   wrangler deploy --name bip

name               = "bip"
main               = "worker/index.ts"
compatibility_date = "2026-06-13"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ── Non-secret config vars (safe to commit) ──────────────────────────────
# OPENAI_API_KEY must be set via `wrangler secret put` — never in this file.
[vars]
# OpenAI model names — rotate without code changes by updating this file.
OPENAI_CHAT_MODEL      = "gpt-4o-mini"
OPENAI_TTS_MODEL       = "gpt-4o-mini-tts"
OPENAI_STT_MODEL       = "whisper-1"

# Connected Supabase project. The Worker currently does not use the anon key.
SUPABASE_URL      = "https://tbsevonvegdnlyjgplmm.supabase.co"

# Audio upload limit in bytes (base64 decoded size cap).
# 512 KB ≈ ~30s of compressed voice at typical Expo AudioRecording settings.
AUDIO_MAX_BYTES   = "524288"

# Comma-separated browser origins allowed via CORS. Leave commented (or "*")
# to keep the permissive wildcard. Native mobile sends no Origin and is
# unaffected; this restricts cross-origin browser callers (the preflight gate).
# ALLOWED_ORIGINS = "https://bip.example.com,https://app.bipapp.com"

# ── Rate limiting (Cloudflare Workers Rate Limiting binding, GA) ──────────
# Caps requests per key (authenticated user when available, else client IP).
# period must be 10 or 60 seconds. namespace_id is an account-unique integer
# string you choose. Bound as env.SEKRET_RATE_LIMITER in worker/index.ts.
[[ratelimits]]
name         = "SEKRET_RATE_LIMITER"
namespace_id = "1001"
simple       = { limit = 60, period = 60 }

# Routes block commented out for beta — using auto-assigned *.workers.dev URL.
# Un-comment and set EXPO_PUBLIC_BACKEND_URL to your custom domain once live.
#
# [[routes]]
# pattern   = "api.bipapp.com/api/sekret/reply"
# zone_name = "bipapp.com"
